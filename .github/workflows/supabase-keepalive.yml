name: Supabase keep-alive

# Projetos Supabase no plano gratuito são pausados após ~7 dias sem atividade.
# Este job faz uma consulta leve toda semana para evitar a pausa.

on:
  schedule:
    - cron: '0 12 * * 1' # segundas, 12:00 UTC (09:00 em Brasília)
  workflow_dispatch: # permite rodar manualmente pela aba Actions

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consulta genérica no Supabase
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Configure os secrets NEXT_PUBLIC_SUPABASE_URL e NEXT_PUBLIC_SUPABASE_ANON_KEY"
            exit 1
          fi

          # SELECT de 1 linha via PostgREST. Com RLS ativo o anon recebe [] (200),
          # o que já conta como atividade no banco.
          status=$(curl -sS -o response.json -w '%{http_code}' \
            --retry 3 --retry-delay 5 --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/entries?select=id&limit=1")

          echo "HTTP $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            cat response.json
            exit 1
          fi
