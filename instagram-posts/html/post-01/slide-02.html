<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Spline+Sans+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/slide.css">
<style>
.title { margin-top: 24px; max-width: 15ch; }
.bill { margin-top: 64px; padding: 12px 44px; }
.bill li { list-style: none; display: flex; justify-content: space-between; align-items: baseline; padding: 26px 0; border-bottom: 2px solid var(--hairline); font-size: 36px; }
.bill li:last-child { border-bottom: 0; }
.bill .mono { font-size: 38px; font-weight: 700; color: var(--flag-red); }
.bill li.total { font-weight: 700; }
.bill li.total .mono { color: var(--ink); }
.lead { margin-top: 48px; max-width: 26ch; }
</style>
</head>
<body class="paper">
<div class="slide">

<p class="label">O problema</p>
<h2 class="title">O salário cai. Some. E no fim do mês ninguém sabe dizer pra onde foi.</h2>
<ul class="bill panel">
  <li><span>Mercado</span><span class="mono">R$ ???</span></li>
  <li><span>Delivery</span><span class="mono">R$ ???</span></li>
  <li><span>Aquela comprinha</span><span class="mono">R$ ???</span></li>
  <li class="total"><span>Sobrou</span><span class="mono">R$ 0,00</span></li>
</ul>
<p class="lead">E a planilha? Dá trabalho, e a gente larga no segundo mês.</p>

<div class="foot"><div class="brand"><img src="../../assets/logos/logo.png" alt="">Amigo do Bolso</div><div class="progress"><span class=""></span><span class="on"></span><span class=""></span><span class=""></span><span class=""></span><span class=""></span></div></div>
</div>
</body>
</html>
